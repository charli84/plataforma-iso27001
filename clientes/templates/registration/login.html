<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ingresar — Portal de cumplimiento</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #1f2937; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
    .caja { background: #fff; padding: 36px 40px; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: #475467; margin-bottom: 6px; margin-top: 14px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 14px; }
    button { margin-top: 22px; width: 100%; padding: 10px; background: #1f2937; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #111827; }
    .error { color: #b91c1c; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Portal de cumplimiento</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<div class="error">Usuario o contraseña incorrectos.</div>{% endif %}
      <label for="id_username">Usuario</label>
      <input type="text" name="username" id="id_username" autofocus required>
      <label for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
